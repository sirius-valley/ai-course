version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-sdk-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_sdk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sdk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:


